<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Journal</h1>
        <p>Write your thoughts. Remember your moments.</p>

        <button id="themeBtn">🌙 Dark Mode</button>
    </header>

    <main>

        <section class="statistics">
            <div class="stat-card">
                <span class="state-icon">📝</span>
            <div>
            <p>Total Entries</p>
            <h3 id="totalEntries">0</h3>
            </div>
            </div>

            <div class="stat-card">
                 <span class="stat-icon">✍️</span>
                 <div>
                    <p>Total characters</p>
                    <h3 id="totalCharacters">0</h3>
                 </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon">😊</span>
                <div>
                    <p>Most Used Mood</p>
                    <h3 id="mostUsedMood">No entries yet</h3>
                </div>

            </div>
        </section>

        <section class="journal-form">
            
            <h2>Today's Journal</h2>

            <p id="message"></p>

            <input type="text" id="title" placeholder="Journal title">

            <select id="mood">
                <option value="">Select your mood</option>
                <option value="😊 Happy">😊 Happy</option>
                <option value="😔 Sad">😔 Sad</option>
                <option value="😌 Calm">😌 Calm</option>
                <option value="😡 Angry">😡 Angry</option>
                <option value="❤️ Loved">❤️ Loved</option>
            </select>

            <textarea
                id="content"
                placeholder="Write your thoughts here..."
            ></textarea>

            <p id="charCount">0 characters</p>

            <button id="saveBtn">Save Journal</button>
            <button id="cancelBtn"> Cancel Edit </button>

        </section>

        <section class="entries">

            <h2>My Entries</h2>

            <div class="filters">

            <input type="text" id="searchInput" placeholder="Search your journals...">

            <select id="moodFilter">
                <option value="all">All Moods</option>
                <option value="😊 Happy">😊 Happy</option>
                <option value="😔 Sad">😔 Sad</option>
                <option value="😌 Calm">😌 Calm</option>
                <option value="😡 Angry">😡 Angry</option>
                <option value="❤️ Loved">❤️ Loved</option>
            </select>
            </div>

            <div id="entriesContainer"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
